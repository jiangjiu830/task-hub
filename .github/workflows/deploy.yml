name: Deploy TaskHub to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（子路径 base 自动取仓库名）
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: 生成 404 回退页
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: 部署到 gh-pages 分支
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
